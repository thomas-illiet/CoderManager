x-database-environment: &database-environment
  CODER_MANAGER_DATABASE_URL: postgresql+asyncpg://coder_manager:coder_manager@postgres:5432/coder_manager
  CODER_MANAGER_DATABASE_SCHEMA: ${CODER_MANAGER_DATABASE_SCHEMA:?CODER_MANAGER_DATABASE_SCHEMA is required}

x-broker-environment: &broker-environment
  CODER_MANAGER_CELERY_BROKER_URL: redis://redis:6379/0

x-metrics-environment: &metrics-environment
  CODER_MANAGER_METRICS_HOST: ${CODER_MANAGER_METRICS_HOST:-0.0.0.0}
  CODER_MANAGER_METRICS_PORT: ${CODER_MANAGER_METRICS_PORT:-9808}

x-api-worker-environment: &api-worker-environment
  CODER_MANAGER_CRYPTO_KEY: ${CODER_MANAGER_CRYPTO_KEY:-}
  CODER_MANAGER_ARGOCD_URL: ${CODER_MANAGER_ARGOCD_URL:-}
  CODER_MANAGER_ARGOCD_REGION: ${CODER_MANAGER_ARGOCD_REGION:-}
  CODER_MANAGER_INSTANCE_DOMAIN: ${CODER_MANAGER_INSTANCE_DOMAIN:-code-studio}
  CODER_MANAGER_ARGOCD_DEVELOPMENT_TOKEN: ${CODER_MANAGER_ARGOCD_DEVELOPMENT_TOKEN:-}
  CODER_MANAGER_ARGOCD_STAGING_TOKEN: ${CODER_MANAGER_ARGOCD_STAGING_TOKEN:-}
  CODER_MANAGER_ARGOCD_PRODUCTION_TOKEN: ${CODER_MANAGER_ARGOCD_PRODUCTION_TOKEN:-}
  CODER_MANAGER_ARGOCD_SKIP_SSL_VERIFY: ${CODER_MANAGER_ARGOCD_SKIP_SSL_VERIFY:-false}
  CODER_MANAGER_ARGOCD_DEVELOPMENT_PROJECT_NAME: ${CODER_MANAGER_ARGOCD_DEVELOPMENT_PROJECT_NAME:-}
  CODER_MANAGER_ARGOCD_STAGING_PROJECT_NAME: ${CODER_MANAGER_ARGOCD_STAGING_PROJECT_NAME:-}
  CODER_MANAGER_ARGOCD_PRODUCTION_PROJECT_NAME: ${CODER_MANAGER_ARGOCD_PRODUCTION_PROJECT_NAME:-}
  CODER_MANAGER_ARGOCD_DEVELOPMENT_APPLICATION_PREFIX: ${CODER_MANAGER_ARGOCD_DEVELOPMENT_APPLICATION_PREFIX:-}
  CODER_MANAGER_ARGOCD_STAGING_APPLICATION_PREFIX: ${CODER_MANAGER_ARGOCD_STAGING_APPLICATION_PREFIX:-}
  CODER_MANAGER_ARGOCD_PRODUCTION_APPLICATION_PREFIX: ${CODER_MANAGER_ARGOCD_PRODUCTION_APPLICATION_PREFIX:-}
  CODER_MANAGER_DEFAULT_ADMINS: ${CODER_MANAGER_DEFAULT_ADMINS:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coder_manager
      POSTGRES_USER: coder_manager
      POSTGRES_PASSWORD: coder_manager
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder_manager -d coder_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *database-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      <<: [*database-environment, *broker-environment, *metrics-environment, *api-worker-environment]
      CODER_MANAGER_APP_NAME: ${CODER_MANAGER_APP_NAME:-Coder Manager}
      CODER_MANAGER_OIDC_ISSUER_URL: ${CODER_MANAGER_OIDC_ISSUER_URL:-}
      CODER_MANAGER_OIDC_CLIENT_ID: ${CODER_MANAGER_OIDC_CLIENT_ID:-}
      CODER_MANAGER_OIDC_AUTHORIZATION_URL: ${CODER_MANAGER_OIDC_AUTHORIZATION_URL:-}
      CODER_MANAGER_OIDC_TOKEN_URL: ${CODER_MANAGER_OIDC_TOKEN_URL:-}
      CODER_MANAGER_OIDC_SCOPES: ${CODER_MANAGER_OIDC_SCOPES:-openid,profile}
    ports:
      - "8000:8000"
    expose:
      - "9808"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command:
      - coder-manager-celery
      - -A
      - coder_manager.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --events
    environment:
      <<: [*database-environment, *broker-environment, *metrics-environment, *api-worker-environment]
      PROMETHEUS_MULTIPROC_DIR: /tmp/coder-manager-prometheus
      CODER_MANAGER_CELERY_RESULT_BACKEND: redis://redis:6379/1
      CODER_MANAGER_JOB_STALE_AFTER_SECONDS: ${CODER_MANAGER_JOB_STALE_AFTER_SECONDS:-300}
      CODER_MANAGER_TEMPLATE_SYNC_POLL_INTERVAL_SECONDS: ${CODER_MANAGER_TEMPLATE_SYNC_POLL_INTERVAL_SECONDS:-2}
      CODER_MANAGER_TEMPLATE_SYNC_TIMEOUT_SECONDS: ${CODER_MANAGER_TEMPLATE_SYNC_TIMEOUT_SECONDS:-1800}
      CODER_MANAGER_WORKSPACE_BUILD_POLL_INTERVAL_SECONDS: ${CODER_MANAGER_WORKSPACE_BUILD_POLL_INTERVAL_SECONDS:-2}
      CODER_MANAGER_WORKSPACE_BUILD_TIMEOUT_SECONDS: ${CODER_MANAGER_WORKSPACE_BUILD_TIMEOUT_SECONDS:-1800}
      CODER_MANAGER_WORKSPACE_STOP_POLL_INTERVAL_SECONDS: ${CODER_MANAGER_WORKSPACE_STOP_POLL_INTERVAL_SECONDS:-2}
      CODER_MANAGER_WORKSPACE_STOP_TIMEOUT_SECONDS: ${CODER_MANAGER_WORKSPACE_STOP_TIMEOUT_SECONDS:-1800}
      CODER_MANAGER_WORKSPACE_DELETE_POLL_INTERVAL_SECONDS: ${CODER_MANAGER_WORKSPACE_DELETE_POLL_INTERVAL_SECONDS:-2}
      CODER_MANAGER_WORKSPACE_DELETE_TIMEOUT_SECONDS: ${CODER_MANAGER_WORKSPACE_DELETE_TIMEOUT_SECONDS:-1800}
      CODER_MANAGER_ARGOCD_REPOSITORY_URL: ${CODER_MANAGER_ARGOCD_REPOSITORY_URL:-}
      CODER_MANAGER_ARGOCD_REPOSITORY_PATH: ${CODER_MANAGER_ARGOCD_REPOSITORY_PATH:-}
      CODER_MANAGER_ARGOCD_TARGET_REVISION: ${CODER_MANAGER_ARGOCD_TARGET_REVISION:-}
      CODER_MANAGER_ARGOCD_DEVELOPMENT_DESTINATION_NAME: ${CODER_MANAGER_ARGOCD_DEVELOPMENT_DESTINATION_NAME:-}
      CODER_MANAGER_ARGOCD_STAGING_DESTINATION_NAME: ${CODER_MANAGER_ARGOCD_STAGING_DESTINATION_NAME:-}
      CODER_MANAGER_ARGOCD_PRODUCTION_DESTINATION_NAME: ${CODER_MANAGER_ARGOCD_PRODUCTION_DESTINATION_NAME:-}
      CODER_MANAGER_CYBERARK_DEVELOPMENT_APP_ID: ${CODER_MANAGER_CYBERARK_DEVELOPMENT_APP_ID:-}
      CODER_MANAGER_CYBERARK_DEVELOPMENT_CERT_NAME: ${CODER_MANAGER_CYBERARK_DEVELOPMENT_CERT_NAME:-}
      CODER_MANAGER_CYBERARK_DEVELOPMENT_KEY_NAME: ${CODER_MANAGER_CYBERARK_DEVELOPMENT_KEY_NAME:-}
      CODER_MANAGER_CYBERARK_DEVELOPMENT_SAFE: ${CODER_MANAGER_CYBERARK_DEVELOPMENT_SAFE:-}
      CODER_MANAGER_CYBERARK_STAGING_APP_ID: ${CODER_MANAGER_CYBERARK_STAGING_APP_ID:-}
      CODER_MANAGER_CYBERARK_STAGING_CERT_NAME: ${CODER_MANAGER_CYBERARK_STAGING_CERT_NAME:-}
      CODER_MANAGER_CYBERARK_STAGING_KEY_NAME: ${CODER_MANAGER_CYBERARK_STAGING_KEY_NAME:-}
      CODER_MANAGER_CYBERARK_STAGING_SAFE: ${CODER_MANAGER_CYBERARK_STAGING_SAFE:-}
      CODER_MANAGER_CYBERARK_PRODUCTION_APP_ID: ${CODER_MANAGER_CYBERARK_PRODUCTION_APP_ID:-}
      CODER_MANAGER_CYBERARK_PRODUCTION_CERT_NAME: ${CODER_MANAGER_CYBERARK_PRODUCTION_CERT_NAME:-}
      CODER_MANAGER_CYBERARK_PRODUCTION_KEY_NAME: ${CODER_MANAGER_CYBERARK_PRODUCTION_KEY_NAME:-}
      CODER_MANAGER_CYBERARK_PRODUCTION_SAFE: ${CODER_MANAGER_CYBERARK_PRODUCTION_SAFE:-}
    expose:
      - "9808"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    build: .
    command:
      - celery
      - -A
      - coder_manager.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
    environment:
      <<: [*broker-environment, *metrics-environment]
      CODER_MANAGER_SCHEDULER_TIMEZONE: ${CODER_MANAGER_SCHEDULER_TIMEZONE:-Europe/Paris}
      CODER_MANAGER_JOB_RETRY_INTERVAL_SECONDS: ${CODER_MANAGER_JOB_RETRY_INTERVAL_SECONDS:-60}
    expose:
      - "9808"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  flower:
    build: .
    command:
      - celery
      - -A
      - coder_manager.celery_app:celery_app
      - flower
      - --port=5555
    environment:
      <<: *broker-environment
      FLOWER_UNAUTHENTICATED_API: ${FLOWER_UNAUTHENTICATED_API:-true}
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres-data:
